name: Rate Limiter CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Redis
        run: |
          docker run -d \
            --name rate-limiter-redis \
            -p 6379:6379 \
            redis:7

          for i in {1..20}; do
            if docker exec rate-limiter-redis redis-cli ping | grep -q PONG; then
              echo "Redis is ready"
              exit 0
            fi

            echo "Waiting for Redis..."
            sleep 2
          done

          docker logs rate-limiter-redis
          exit 1

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --runInBand
        env:
          REDIS_URL: redis://localhost:6379

      - name: Build application
        run: npm run build

      - name: Cleanup Redis
        if: always()
        run: docker rm -f rate-limiter-redis || true
